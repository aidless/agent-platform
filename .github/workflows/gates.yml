name: gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-gates:
    # 这个徽章只表示离线门禁。它不表示生产可用，也不表示 Docker / ollama 路径跑过。
    # 覆盖：9 个离线模块的 --smoke、compileall、results 契约、
    #       README/demo 与 results/*.json 的 claim drift、demo 契约测试。
    # 不覆盖：M4b（需要本机已有 python:3.12-slim，仓库不拉取镜像）、
    #         M6（需要已经在跑的容器 aihot-db-1，仓库没有 compose）、
    #         m1 --live / m3b --live（需要本机 ollama）。
    # 证据扫描是审计，命中不失败。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps (stdlib only; docker and ollama are optional)
        run: python3 tools/deps_check.py

      - name: make gates
        run: make gates

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-scan
          path: results/evidence_scan.json
          if-no-files-found: warn
