name: gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-gates:
    # CI 只跑离线档。理由（与 Makefile 注释一致）：
    #   M6 需要 docker 里的 PostgreSQL（aihot-db-1）
    #   m1 --live / m3b --live 需要本机 ollama + 可用显存
    #   GitHub-hosted runner 三者都没有。把需要它们的模块放进 CI
    #   只会得到永远红的构建 —— 那比没有门禁更糟。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps (none required)
        run: python3 -c "import sys; print(sys.version)"

      - name: make smoke-offline
        run: make smoke-offline

      - name: demo contract tests
        run: python3 -m unittest demo/test_demo.py -v

      - name: static checks
        run: |
          python3 -m compileall -q src && echo "compileall OK"
          python3 tools/check_contract.py

      - name: evidence scan (audit only, non-blocking)
        run: |
          python3 tools/evidence_scan.py . --json results/evidence_scan_ci.json || true
          echo "→ 有命中不阻断：这是审计清单，不是判决（见 docs/engineering.md）"
          echo "→ 判断规则：命中数 > 0 不代表代码错，只代表这些位置需要人工核对。"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-scan
          path: results/evidence_scan_ci.json
          if-no-files-found: warn
